name: readme

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update-readme.mjs, .github/workflows/readme.yml]

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-readme.mjs
        env:
          MUSIC_WAREHOUSE_TOKEN: ${{ secrets.MUSIC_WAREHOUSE_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(readme): refresh writing and listening'
          git push
